apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: vllm
spec:
  replicas: 1
  startupPolicy: LeaderCreated
  rolloutStrategy:
    type: RollingUpdate
    rollingUpdateConfiguration:
      maxSurge: 0
      maxUnavailable: 1
  leaderWorkerTemplate:
    size: 2
    restartPolicy: RecreateGroupOnPodRestart
    leaderTemplate:
      metadata:
        labels:
          app.kubernetes.io/name: vllm
          role: leader
      spec:
        automountServiceAccountToken: false
        enableServiceLinks: false
        securityContext:
          runAsNonRoot: true
          runAsUser: 2000
          runAsGroup: 2000
          fsGroup: 2000
          seccompProfile:
            type: RuntimeDefault
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    leaderworkerset.sigs.k8s.io/name: vllm
                topologyKey: kubernetes.io/hostname
        containers:
          - name: vllm
            image: vllm/vllm-openai:v0.33.0@sha256:d825baf9ce4b1b6bfc5ecc7b79880c7e6748c65a72d697ce3d47607aafa84c6e
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            workingDir: /tmp
            env:
              - name: HOME
                value: /tmp
              - name: HF_HOME
                value: /tmp/huggingface
              - name: HF_HUB_OFFLINE
                value: "1"
              - name: TRANSFORMERS_OFFLINE
                value: "1"
              - name: XDG_CACHE_HOME
                value: /tmp/cache
              - name: VLLM_CACHE_ROOT
                value: /tmp/vllm-cache
              - name: VLLM_HOST_IP
                valueFrom:
                  fieldRef:
                    fieldPath: status.podIP
            command: ["vllm", "serve"]
            args:
              - /models/meta-models/Muse-Glimmer-30B/cec94fcfd6512f2cfe708138c32533b346ea4f69
              - --served-model-name
              - meta-models/Muse-Glimmer-30B
              - --language-model-only
              - --default-chat-template-kwargs
              - '{"reasoning_strength": "low"}'
              - --reasoning-parser
              - muse_glimmer
              - --dtype
              - bfloat16
              - --tensor-parallel-size
              - "1"
              - --pipeline-parallel-size
              - "$(LWS_GROUP_SIZE)"
              - --distributed-executor-backend
              - mp
              - --nnodes
              - "$(LWS_GROUP_SIZE)"
              - --node-rank
              - "$(LWS_WORKER_INDEX)"
              - --master-addr
              - "$(LWS_LEADER_ADDRESS)"
              - --host
              - 0.0.0.0
              - --port
              - "8000"
              - --max-model-len
              - "2048"
              - --max-num-seqs
              - "8"
              - --gpu-memory-utilization
              - "0.9"
              - --enforce-eager
            ports:
              - name: http
                containerPort: 8000
            resources:
              requests:
                cpu: "4"
                memory: 16Gi
                nvidia.com/gpu: 1
              limits:
                cpu: "8"
                memory: 64Gi
                nvidia.com/gpu: 1
            startupProbe:
              httpGet:
                path: /health
                port: http
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 180
            readinessProbe:
              httpGet:
                path: /health
                port: http
              periodSeconds: 5
              timeoutSeconds: 5
            livenessProbe:
              httpGet:
                path: /health
                port: http
              periodSeconds: 10
              timeoutSeconds: 5
            volumeMounts:
              - name: model-cache
                mountPath: /models
                readOnly: true
              - name: shm
                mountPath: /dev/shm
        volumes:
          - name: model-cache
            persistentVolumeClaim:
              claimName: workshop-models
              readOnly: true
          - name: shm
            emptyDir:
              medium: Memory
              sizeLimit: 1Gi
    workerTemplate:
      metadata:
        labels:
          app.kubernetes.io/name: vllm
          role: worker
      spec:
        automountServiceAccountToken: false
        enableServiceLinks: false
        securityContext:
          runAsNonRoot: true
          runAsUser: 2000
          runAsGroup: 2000
          fsGroup: 2000
          seccompProfile:
            type: RuntimeDefault
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    leaderworkerset.sigs.k8s.io/name: vllm
                topologyKey: kubernetes.io/hostname
        containers:
          - name: vllm
            image: vllm/vllm-openai:v0.33.0@sha256:d825baf9ce4b1b6bfc5ecc7b79880c7e6748c65a72d697ce3d47607aafa84c6e
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            workingDir: /tmp
            env:
              - name: HOME
                value: /tmp
              - name: HF_HOME
                value: /tmp/huggingface
              - name: HF_HUB_OFFLINE
                value: "1"
              - name: TRANSFORMERS_OFFLINE
                value: "1"
              - name: XDG_CACHE_HOME
                value: /tmp/cache
              - name: VLLM_CACHE_ROOT
                value: /tmp/vllm-cache
              - name: VLLM_HOST_IP
                valueFrom:
                  fieldRef:
                    fieldPath: status.podIP
            command: ["vllm", "serve"]
            args:
              - /models/meta-models/Muse-Glimmer-30B/cec94fcfd6512f2cfe708138c32533b346ea4f69
              - --served-model-name
              - meta-models/Muse-Glimmer-30B
              - --language-model-only
              - --default-chat-template-kwargs
              - '{"reasoning_strength": "low"}'
              - --reasoning-parser
              - muse_glimmer
              - --dtype
              - bfloat16
              - --tensor-parallel-size
              - "1"
              - --pipeline-parallel-size
              - "$(LWS_GROUP_SIZE)"
              - --distributed-executor-backend
              - mp
              - --nnodes
              - "$(LWS_GROUP_SIZE)"
              - --node-rank
              - "$(LWS_WORKER_INDEX)"
              - --master-addr
              - "$(LWS_LEADER_ADDRESS)"
              - --headless
              - --max-model-len
              - "2048"
              - --max-num-seqs
              - "8"
              - --gpu-memory-utilization
              - "0.9"
              - --enforce-eager
            resources:
              requests:
                cpu: "4"
                memory: 16Gi
                nvidia.com/gpu: 1
              limits:
                cpu: "8"
                memory: 64Gi
                nvidia.com/gpu: 1
            volumeMounts:
              - name: model-cache
                mountPath: /models
                readOnly: true
              - name: shm
                mountPath: /dev/shm
        volumes:
          - name: model-cache
            persistentVolumeClaim:
              claimName: workshop-models
              readOnly: true
          - name: shm
            emptyDir:
              medium: Memory
              sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-leader
spec:
  type: ClusterIP
  selector:
    leaderworkerset.sigs.k8s.io/name: vllm
    role: leader
  ports:
    - name: http
      port: 8000
      targetPort: http
